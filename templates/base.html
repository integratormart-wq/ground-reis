<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">GR</span>
      <span class="brand-text">ООО «ГРАУНД»</span>
    </div>
    <nav class="nav-main">
      {% for item in menu %}
      <a href="{{ item.href }}" class="nav-link">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <div class="userbox">
      <span class="user-name">{{ user.full_name }}</span>
      <a href="/logout" class="btn btn-ghost btn-sm">Выход</a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="bottom">
    <div>© 2026 ООО «ГРАУНД» | Внутренний сервис учета рейсов</div>
  </footer>
</body>
</html>

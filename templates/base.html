<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="manifest" href="/static/manifest.json" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">GR</span>
      <span class="brand-text">ООО «ГРАУНД»</span>
    </div>
    <nav class="nav-main">
      {% for item in menu %}
      <a href="{{ item.href }}" class="nav-link">{{ item.label }}</a>
      {% endfor %}
    </nav>
    <div class="userbox">
      <button id="install-app" class="btn btn-primary btn-sm" type="button">Установить приложение</button>
      <span class="user-name">{{ user.full_name }}</span>
      <a href="/logout" class="btn btn-ghost btn-sm">Выход</a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="bottom">
    <div>© 2026 ООО «ГРАУНД» | Внутренний сервис учета рейсов</div>
  </footer>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function () {});
    }
    let installPrompt = null;
    const installButton = document.getElementById('install-app');
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      installPrompt = event;
      if (installButton) installButton.hidden = false;
    });
    if (installButton) installButton.addEventListener('click', async function () {
      if (installPrompt) {
        installPrompt.prompt();
        await installPrompt.userChoice;
        installPrompt = null;
        installButton.hidden = true;
        return;
      }
      alert('Android: откройте меню браузера ⋮ и выберите «Установить приложение». iPhone: нажмите «Поделиться» → «На экран Домой».');
    });
    window.addEventListener('appinstalled', function () {
      if (installButton) installButton.hidden = true;
    });
    if (window.matchMedia('(display-mode: standalone)').matches && installButton) {
      installButton.hidden = true;
    }
  </script>
</body>
</html>

{% extends "base.html" %}
{% block content %}
<div class="page-header"><h1>Пользователи</h1></div>
<div class="form">
  <form method="post" action="/users/new" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
    <label>Имя<input name="full_name" required /></label>
    <label>Логин<input name="login" required /></label>
    <label>Пароль<input type="password" name="password" required /></label>
    <label>Роль
      <select name="role">
        <option value="admin">Админ</option>
        <option value="logist">Логист</option>
        <option value="driver">Водитель</option>
      </select>
    </label>
    <div class="form-row"><button class="btn btn-primary" type="submit">Добавить</button></div>
  </form>
</div>
<div class="filters">
  <form method="get" style="display:flex;flex-wrap:wrap;gap:10px;align-items:end">
    <input name="q" value="{{ request.query_params.q or '' }}" placeholder="Поиск по логину/имени" />
    <button class="btn" type="submit">Поиск</button>
  </form>
</div>
<table class="table">
  <thead><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Активен</th><th></th></tr></thead>
  <tbody>
  {% for u in users %}
  <tr>
    <td>{{ u.full_name }}</td>
    <td>{{ u.login }}</td>
    <td>{{ u.role.value }}</td>
    <td>{{ 'Да' if u.is_active else 'Нет' }}</td>
    <td>
      {% if u.id != user.id %}
      <form method="post" action="/users/{{ u.id }}/delete" style="display:inline" onsubmit="return confirm('Удалить пользователя?')">
        <button class="btn btn-danger" type="submit">Удалить</button>
      </form>
      {% endif %}
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}

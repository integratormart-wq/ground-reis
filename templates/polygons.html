{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Полигоны</h1>
</div>
<div class="filters">
  <form method="post" style="display:flex;flex-wrap:wrap;gap:8px;align-items:end">
    <input type="text" name="name" placeholder="Новый полигон" required style="min-width:220px" />
    <input type="text" name="address" placeholder="Адрес" style="min-width:260px" />
    <button class="btn" type="submit">Добавить</button>
  </form>
</div>
<div class="filters">
  <form method="get" style="display:flex;flex-wrap:wrap;gap:10px;align-items:end">
    <select name="polygon_id"><option value="">Все полигоны</option>{% for p in polygons %}<option value="{{ p.id }}" {% if polygon_id==p.id|string %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select>
    <select name="driver_id"><option value="">Все водители</option>{% for d in drivers %}<option value="{{ d.id }}" {% if driver_id==d.id|string %}selected{% endif %}>{{ d.full_name }}</option>{% endfor %}</select>
    <label>С<input type="date" name="date_from" value="{{ date_from or '' }}" /></label>
    <label>По<input type="date" name="date_to" value="{{ date_to or '' }}" /></label>
    <button class="btn" type="submit">Фильтр</button>
    <a class="btn" href="/export/polygons.csv?polygon_id={{ polygon_id }}&driver_id={{ driver_id }}&date_from={{ date_from }}&date_to={{ date_to }}">Выгрузить сводную CSV</a>
    {% if polygon_id %}
    <a class="btn" href="/export/polygon.csv?polygon_id={{ polygon_id }}&driver_id={{ driver_id }}&date_from={{ date_from }}&date_to={{ date_to }}">Выгрузить заявки полигона</a>
    {% endif %}
  </form>
</div>
<div class="table-wrap"><table class="table">
  <thead><tr><th>Полигон</th><th>Заявок</th><th>Объем, м3</th><th>Сумма</th><th></th></tr></thead>
  <tbody>
  {% for it in items %}
  <tr><td>{{ it.name }}</td><td>{{ it.trips }}</td><td>{{ it.volume }}</td><td>{{ "%.0f"|format(it.sum) }} ₽</td><td><a href="/export/polygon.csv?polygon_id={{ it.id }}&driver_id={{ driver_id }}&date_from={{ date_from }}&date_to={{ date_to }}">CSV</a></td></tr>
  {% endfor %}
  </tbody>
</table></div>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор адреса объекта</title>
<style>
  :root { --c1:#2fc6f6; --c2:#0b66c3; --gray:#525c69; --border:#e0e5ea; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"OpenSans", "Helvetica Neue", Arial, sans-serif; font-size:14px; color:#333;
         background:#f7f8fa; min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:6px; padding:16px; margin-bottom:14px; }
  .btn { display:inline-block; padding:9px 16px; border:none; border-radius:4px; cursor:pointer; font-size:14px; }
  .btn-primary { background:var(--c2); color:#fff; }
  .btn-primary:hover { background:#0a5aa8; }
  .btn-ghost { background:#fff; color:var(--c2); border:1px solid var(--c2); }
  .btn-sm { padding:6px 10px; font-size:13px; }
  .muted { color:#8a919c; font-size:12px; }
  .addr-item { border:1px solid var(--border); border-radius:5px; padding:10px 12px; margin-bottom:8px; display:flex;
               justify-content:space-between; align-items:center; gap:10px; }
  .addr-name { font-weight:600; }
  .addr-meta { color:#697079; font-size:12px; margin-top:2px; line-height:1.45; }
  label { display:block; font-size:12px; color:var(--gray); margin:10px 0 4px; }
  input, textarea { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:4px; font-size:14px; font-family:inherit; }
  input:focus, textarea:focus { outline:none; border-color:var(--c1); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:200px; }
  .msg { padding:10px 12px; border-radius:4px; margin-bottom:10px; display:none; }
  .msg-ok { background:#eafbf2; color:#1f9d55; border:1px solid #c1ecd4; }
  .msg-err { background:#fdeeee; color:#d33; border:1px solid #f4caca; }
  .status { background:#f0f7ff; border:1px solid #d5e6fb; border-radius:4px; padding:8px 12px; margin-bottom:10px;
            font-size:12px; color:#0b66c3; min-height:16px; }
  .spinner { color:var(--gray); padding:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="status" class="status">Загрузка…</div>
  <div id="error" class="msg msg-err"></div>
  <div id="success" class="msg msg-ok"></div>

  <div class="card">
    <button class="btn btn-primary" id="btnPick">📍 Выбрать адрес объекта</button>
    <button class="btn btn-ghost" id="btnAdd">+ Добавить новый адрес</button>
  </div>

  <div class="card" id="pickerCard" style="display:none;">
    <div id="list" class="spinner">Загрузка адресов…</div>
  </div>

  <div class="card" id="addCard" style="display:none;">
    <h3 style="margin:0 0 6px;">Новый адрес</h3>
    <div class="muted" id="addCompanyNote"></div>
    <label>Адрес объекта *</label>
    <input id="fAddr" placeholder="Например: Строителей 7">
    <div class="row">
      <div><label>Контакт на объекте</label><input id="fContact" placeholder="Имя"></div>
      <div><label>Телефон</label><input id="fPhone" placeholder="+7…"></div>
    </div>
    <label>Комментарий по подъезду</label>
    <textarea id="fComm" rows="2" placeholder="Номер подъезда, как зайти"></textarea>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" id="btnSaveNew">Сохранить</button>
      <button class="btn btn-ghost" id="btnCancelNew">Отмена</button>
    </div>
  </div>
</div>

<script src="//api.bitrix24.com/api/v1/"></script>
<script>
/* ============ НАСТРОЙКИ ПОЛЕЙ (проверены для ГРАУНД b24-7h3u4x) ============ */
var ENTITY_ADDRESS = 1106;               // смарт-процесс «Адрес объекта»
var CFG = {
  ADDR_FIELD:      'ufCrm36_1788962453750', // «Адрес»
  CONTACT_FIELD:   'ufCrm36_1788962655732', // «Контактное лицо»
  PHONE_FIELD:     'ufCrm36_1788962624616', // «Номер контактного лица»
  ENTRANCE_FIELD:  'ufCrm36EntranceComment', // «Комментарий по подъезду»
  COMPANY_FIELD:   'companyId',             // «Компания» (для фильтра)
  DEAL_CONTACT:    'UF_CRM_GROUND_CONTACT_OBJECT',
  DEAL_PHONE:      'UF_CRM_GROUND_PHONE_OBJECT',
  DEAL_ENTRANCE:   'UF_CRM_GROUND_ENTRANCE_COMMENT',
  DEAL_ADDRESS:    'UF_CRM_GROUND_ADDRESS_PODACHA'
};

var dealId = null;
var companyId = null;
var companyTitle = '';

function $(id){ return document.getElementById(id); }
function show(id, v){ $(id).style.display = v ? '' : 'none'; }
function status(m){ $('status').textContent = m || ''; }
function err(m){ var e=$('error'); e.textContent=m; show('error', !!m); show('success', false); }
function ok(m){ var s=$('success'); s.textContent=m; show('success', !!m); show('error', false); }

/* Любые JS-ошибки выводим на экран — чтобы видеть, что ломается */
window.onerror = function(msg, src, line, col){
  try { status('JS-ошибка: ' + msg + ' (строка ' + line + ')'); } catch(e){}
  return false;
};

/* Универсальное получение данных placement.info: поддерживает и колбэк, и промис */
function getPlacementInfo(cb){
  var done = false;
  function finish(info){ if(!done){ done = true; cb(info); } }
  try {
    var r = BX24.placement.info(finish);   // колбэк-стиль
    if (r && typeof r.then === 'function') { r.then(finish).catch(function(){ finish(null); }); }
  } catch(e) {
    try {
      var r2 = BX24.placement.info();       // промис-стиль
      if (r2 && typeof r2.then === 'function') { r2.then(finish).catch(function(){ finish(null); }); }
      else { finish(null); }
    } catch(e2) { finish(null); }
  }
  setTimeout(function(){ finish(null); }, 6000); // таймаут
}

function extractDealId(info){
  var o = (info && info.options) ? info.options : (info || {});
  return o.ID || o.id || o.entityId || o.entity_id || o.ENTITY_ID || null;
}

function initWidget(){
  status('Читаю сделку…');
  getPlacementInfo(function(info){
    dealId = extractDealId(info);
    if(!dealId){
      status('ID сделки не определён');
      err('Не удалось определить сделку. Покажите этот экран — подскажу дальше.');
      return;
    }
    status('Сделка ID ' + dealId + '. Читаю компанию…');
    loadCompany();
  });
}

function loadCompany(){
  BX24.callMethod('crm.deal.get', {id: dealId}, function(res){
    if(res.error()){ status('Ошибка чтения сделки'); err('Ошибка чтения сделки: ' + res.error()); return; }
    var d = res.answer.result;
    companyId = d.COMPANY_ID || null;
    companyTitle = d.TITLE || '';
    if(!companyId){
      status('Компания в сделке не выбрана');
      err('Сначала выберите компанию в сделке.');
      return;
    }
    status('Компания задана (ID ' + companyId + '). Готово к выбору адреса.');
  });
}

function openPicker(){
  closeAll();
  if(!dealId){ err('Нет сделки. Обновите вкладку.'); return; }
  if(!companyId){ status('Читаю компанию…'); loadCompany(); err('Компания не определена. Выберите её в сделке.'); return; }
  show('pickerCard', true);
  $('list').innerHTML = '<div class="spinner">Загрузка адресов…</div>';
  BX24.callMethod('crm.item.list', {
    entityTypeId: ENTITY_ADDRESS,
    filter: { [CFG.COMPANY_FIELD]: companyId },
    select: ['id','title', CFG.ADDR_FIELD, CFG.CONTACT_FIELD, CFG.PHONE_FIELD, CFG.ENTRANCE_FIELD]
  }, function(res){
    if(res.error()){ err('Ошибка загрузки адресов: ' + res.error()); return; }
    var items = res.answer.result.items || [];
    renderList(items);
  });
}

function renderList(items){
  var el = $('list');
  if(!items.length){
    el.innerHTML = '<div class="muted">У этой компании нет адресов.</div>' +
                   '<button class="btn btn-primary btn-sm" style="margin-top:8px;" id="btnAddEmpty">+ Добавить новый адрес</button>';
    document.getElementById('btnAddEmpty').addEventListener('click', openAddForm);
    return;
  }
  var html = '';
  items.forEach(function(it){
    var addr = it[CFG.ADDR_FIELD] || '(без адреса)';
    var contact = it[CFG.CONTACT_FIELD] || '—';
    var phone = it[CFG.PHONE_FIELD] || '—';
    var entrance = it[CFG.ENTRANCE_FIELD] || '—';
    html += '<div class="addr-item">' +
              '<div><div class="addr-name">' + esc(addr) + '</div>' +
              '<div class="addr-meta">Контакт: ' + esc(contact) + '<br>Телефон: ' + esc(phone) + '<br>Подъезд: ' + esc(entrance) + '</div></div>' +
              '<button class="btn btn-primary btn-sm" data-id="' + it.id + '">Выбрать</button>' +
            '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('button[data-id]').forEach(function(b){
    b.addEventListener('click', function(){ selectById(b.getAttribute('data-id')); });
  });
}

function selectById(id){
  BX24.callMethod('crm.item.get', {entityTypeId: ENTITY_ADDRESS, id: id}, function(res){
    if(res.error()){ err('Ошибка чтения адреса: ' + res.error()); return; }
    applyToDeal(res.answer.result.item);
  });
}

function applyToDeal(it){
  var fields = {};
  fields[CFG.DEAL_CONTACT]  = it[CFG.CONTACT_FIELD]  || '';
  fields[CFG.DEAL_PHONE]    = it[CFG.PHONE_FIELD]    || '';
  fields[CFG.DEAL_ENTRANCE] = it[CFG.ENTRANCE_FIELD] || '';
  fields[CFG.DEAL_ADDRESS]  = it[CFG.ADDR_FIELD]     || '';
  BX24.callMethod('crm.deal.update', {id: dealId, fields: fields}, function(res){
    if(res.error()){ err('Не удалось записать в сделку: ' + res.error()); return; }
    ok('Адрес выбран и записан в сделку.');
    closeAll();
  });
}

function openAddForm(){
  closeAll();
  if(!companyId){ err('Сначала выберите компанию в сделке.'); return; }
  show('addCard', true);
  $('addCompanyNote').textContent = 'Будет привязан к компании ID ' + companyId + '.';
}

function saveNewAddress(){
  var addr = $('fAddr').value.trim();
  if(!addr){ err('Укажите адрес объекта.'); return; }
  var fields = {};
  fields[CFG.COMPANY_FIELD] = companyId;
  fields[CFG.ADDR_FIELD]     = addr;
  fields[CFG.CONTACT_FIELD]  = $('fContact').value.trim();
  fields[CFG.PHONE_FIELD]    = $('fPhone').value.trim();
  fields[CFG.ENTRANCE_FIELD] = $('fComm').value.trim();
  BX24.callMethod('crm.item.add', {
    entityTypeId: ENTITY_ADDRESS,
    fields: Object.assign({ title: addr }, fields)
  }, function(res){
    if(res.error()){ err('Не удалось сохранить адрес: ' + res.error()); return; }
    ok('Новый адрес сохранён.');
    $('fAddr').value=''; $('fContact').value=''; $('fPhone').value=''; $('fComm').value='';
    closeAll();
  });
}

function closeAll(){
  show('pickerCard', false);
  show('addCard', false);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ============ ИНИЦИАЛИЗАЦИЯ ============ */
document.getElementById('btnPick').addEventListener('click', openPicker);
document.getElementById('btnAdd').addEventListener('click', openAddForm);
document.getElementById('btnSaveNew').addEventListener('click', saveNewAddress);
document.getElementById('btnCancelNew').addEventListener('click', closeAll);

if (typeof BX24 === 'undefined') {
  status('SDK Bitrix24 не загрузился');
  err('SDK Bitrix24 не загрузился. Обновите страницу.');
} else {
  try {
    BX24.init(initWidget);
  } catch(e) {
    // если init недоступен — пробуем сразу
    initWidget();
  }
}
</script>
</body>
</html>
